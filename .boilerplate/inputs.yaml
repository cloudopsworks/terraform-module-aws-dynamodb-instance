# DynamoDB Instance Module — deployment configuration
# Generated by terragrunt scaffold from .boilerplate/inputs.yaml
# Fill in the values below before running `terragrunt apply`.

# name_prefix: "myapp"  # (Optional) Prefix for the DynamoDB table name. Default: ""
#                        # Used to build the table name as: <name_prefix>-<system_name>
#                        # Ignored when `name` is set.
name_prefix: ""

# name: ""  # (Optional) Explicit table name. Overrides name_prefix when set. Default: ""
#            # Hyphens are converted to underscores for DynamoDB table naming.
name: ""

# db:  # (Required) Main DynamoDB table configuration.
db:
  # attributes:  # (Required) List of attribute definitions for the table.
  #   - name: "id"    # (Required) Name of the attribute.
  #     type: "S"     # (Required) Attribute type: "S" (String), "N" (Number), "B" (Binary).
  attributes:
    - name: "id"
      type: "S"

  # hash_key: "id"  # (Required) Partition key attribute name. Must match an attribute name above.
  hash_key: "id"

  # range_key: ""  # (Optional) Sort key attribute name. Must match an attribute name above. Default: null
  range_key: ""

  # autoscaling:  # (Optional) DynamoDB autoscaling configuration. Default: disabled
  autoscaling:
    # enabled: false  # (Optional) Enable autoscaling. Default: false
    enabled: false
    # defaults:  # (Optional) Default autoscaling limits applied to table read/write.
    defaults:
      # min_capacity: 1   # (Optional) Minimum capacity units. Default: 1
      min_capacity: 1
      # max_capacity: 10  # (Optional) Maximum capacity units. Default: 10
      max_capacity: 10
    # indexes:  # (Optional) Per-index autoscaling overrides. Default: {}
    indexes: {}
    # read:  # (Optional) Read autoscaling policy.
    read:
      # target_value: 70  # (Optional) Target utilization percentage. Default: 70
      target_value: 70
    # write:  # (Optional) Write autoscaling policy.
    write:
      # target_value: 70  # (Optional) Target utilization percentage. Default: 70
      target_value: 70

  # capacity:  # (Optional) Table capacity settings.
  capacity:
    # billing_mode: "PAY_PER_REQUEST"  # (Optional) Billing mode: "PAY_PER_REQUEST" or "PROVISIONED". Default: "PAY_PER_REQUEST"
    billing_mode: "PAY_PER_REQUEST"
    # read: 0   # (Optional) Provisioned read capacity units. Only used when billing_mode is "PROVISIONED". Default: 0
    read: 0
    # write: 0  # (Optional) Provisioned write capacity units. Only used when billing_mode is "PROVISIONED". Default: 0
    write: 0

  # deletion_protection: false  # (Optional) Enable deletion protection on the table. Default: false
  deletion_protection: false

  # encryption:  # (Optional) Server-side encryption configuration.
  encryption:
    # enabled: false  # (Optional) Enable server-side encryption. Default: false
    enabled: false
    # kms_key_arn: ""  # (Optional) KMS key ARN for encryption. Uses AWS-managed key when omitted. Default: null
    kms_key_arn: ""

  # recovery:  # (Optional) Point-in-time recovery configuration.
  recovery:
    # enabled: false  # (Optional) Enable point-in-time recovery. Default: false
    enabled: false
    # period_in_days: -1  # (Optional) Recovery window in days. -1 means provider default. Default: -1
    period_in_days: -1

  # replicas:  # (Optional) List of replica region configurations for global tables. Default: []
  replicas: []
  #   - region_name: "us-west-2"            # (Required) AWS region for the replica.
  #     propagate_tags: false               # (Optional) Propagate tags to the replica. Default: false
  #     point_in_time_recovery: false       # (Optional) Enable PITR for the replica. Default: false
  #     kms_key_arn: ""                     # (Optional) KMS key ARN for replica encryption. Default: null

  # stream:  # (Optional) DynamoDB Streams configuration.
  stream:
    # enabled: false  # (Optional) Enable DynamoDB Streams. Default: false
    enabled: false
    # view_type: "NEW_AND_OLD_IMAGES"  # (Optional) Stream view type.
    #   Valid values: "NEW_IMAGE", "OLD_IMAGE", "NEW_AND_OLD_IMAGES", "KEYS_ONLY". Default: null
    view_type: "NEW_AND_OLD_IMAGES"

  # table_class: "STANDARD"  # (Optional) Storage class for the table.
  #   Valid values: "STANDARD", "STANDARD_INFREQUENT_ACCESS". Default: null (provider default: STANDARD)
  table_class: "STANDARD"

  # ttl:  # (Optional) Time-To-Live configuration.
  ttl:
    # enabled: false  # (Optional) Enable TTL. Default: false
    enabled: false
    # attribute_name: "expires_at"  # (Optional) Attribute used as the TTL value (epoch seconds). Default: null
    attribute_name: "expires_at"

  # global_secondary_indexes:  # (Optional) List of Global Secondary Index definitions. Default: []
  global_secondary_indexes: []
  #   - name: "gsi_name"                  # (Required) GSI name.
  #     hash_key: "gsi_hash_key"          # (Required) GSI partition key attribute name.
  #     range_key: ""                     # (Optional) GSI sort key attribute name. Default: null
  #     read_capacity: 0                  # (Optional) Provisioned read capacity for the GSI. Default: 0
  #     write_capacity: 0                 # (Optional) Provisioned write capacity for the GSI. Default: 0
  #     projection_type: "ALL"            # (Optional) Projection type: "ALL", "KEYS_ONLY", "INCLUDE". Default: "ALL"
  #     non_key_attributes: []            # (Optional) Attributes to project when projection_type is "INCLUDE". Default: []
  #     on_demand_throughput:             # (Optional) On-demand throughput for the GSI.
  #       max_read_request_units: 0       # (Optional) Max read request units. Default: 0
  #       max_write_request_units: 0      # (Optional) Max write request units. Default: 0

  # ignore_changes_global_secondary_index: false  # (Optional) Ignore lifecycle changes on GSIs. Default: false
  ignore_changes_global_secondary_index: false

  # local_secondary_indexes:  # (Optional) List of Local Secondary Index definitions. Default: []
  local_secondary_indexes: []
  #   - name: "lsi_name"                 # (Required) LSI name.
  #     range_key: "lsi_range_key"       # (Required) LSI sort key attribute name.
  #     projection_type: "ALL"           # (Optional) Projection type: "ALL", "KEYS_ONLY", "INCLUDE". Default: "ALL"
  #     non_key_attributes: []           # (Optional) Attributes to project when projection_type is "INCLUDE". Default: []

  # import_table:  # (Optional) Configuration for importing data from S3. Default: {}
  #   input_format: "CSV"                 # (Required) Import format: "CSV", "DYNAMODB_JSON", "ION".
  #   input_compression_type: "NONE"     # (Optional) Compression: "GZIP", "BZIP2", "ZSTD", "NONE". Default: "NONE"
  #   bucket: "my-import-bucket"         # (Required) S3 bucket containing the import data.
  #   key_prefix: ""                     # (Optional) S3 key prefix for the import data. Default: ""
  #   input_format_options:              # (Optional) Format-specific options.
  #     csv:
  #       delimiter: ","                 # (Optional) CSV delimiter character. Default: ","
  #       header_list: []               # (Optional) List of column headers. Default: []
