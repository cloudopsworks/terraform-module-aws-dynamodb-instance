description: |-
  Terraform module that provisions a single Amazon DynamoDB table, driven by one structured,
  YAML-friendly `db` object. It wraps the community
  [`terraform-aws-modules/dynamodb-table/aws`](https://registry.terraform.io/modules/terraform-aws-modules/dynamodb-table/aws)
  module (`~> 5.0`) and adds the CloudOps Works naming and tagging conventions.

  Key features:

  | Feature | `db` key | Default |
  |---------|----------|---------|
  | Partition and sort keys | `attributes`, `hash_key`, `range_key` | `range_key` unset |
  | On-demand or provisioned billing | `capacity` | `PAY_PER_REQUEST` |
  | Application Auto Scaling for the table and its GSIs | `autoscaling` | disabled |
  | Deletion protection | `deletion_protection` | **enabled** |
  | Server-side encryption with an AWS managed or customer managed KMS key | `encryption` | AWS owned key |
  | Point-in-time recovery with a configurable window | `recovery` | disabled |
  | DynamoDB Streams | `stream` | disabled |
  | Time to live | `ttl` | disabled |
  | Global tables (replicas) | `replicas.regions` or `replicas` | none |
  | Global and local secondary indexes | `global_secondary_indexes`, `local_secondary_indexes` | none |
  | Table creation from an S3 import | `import_table` | none |
  | Storage class | `table_class` | `STANDARD` |
  | Organization tags merged with `extra_tags` | — | always |

# Introduction to the project
introduction: |-
  The module creates exactly one DynamoDB table per deployment. It is designed for the
  CloudOps Works Terragrunt hierarchy: the organization, spoke and tags are inherited from the
  parent folders, and each deployment only describes its table in `inputs.yaml`.

  ### Table naming

  | Inputs | Resulting table name |
  |--------|----------------------|
  | `name: "orders-table"` | `orders_table` |
  | `name_prefix: "myapp"` (no `name`) in `us-east-1`, spoke `001`, org unit `devops`, environment `prod` / `production` | `myapp_devops_prod_production_001_usea1` |

  `name` wins over `name_prefix`. In both cases hyphens are replaced by underscores. Set at
  least one of the two; with both empty the table name starts with an underscore.

  ### Behaviour worth knowing

  - **Deletion protection is on by default.** Set `db.deletion_protection: false` explicitly
    for tables you expect to destroy (for example ephemeral test environments).
  - **Autoscaling defaults are merged.** `db.autoscaling.defaults` is merged on top of
    `scale_in_cooldown: 0`, `scale_out_cooldown: 0` and `target_value: 70`, so you can override
    a single key. Table read/write scaling needs `max_capacity`; the minimum capacity is
    `db.capacity.read` / `db.capacity.write`.
  - **Two replica forms.** Declare global table replicas as `db.replicas.regions: [...]` or
    as a plain list directly under `db.replicas: [...]`; both forms are equivalent.
  - **`projection_type` is required** on every global and local secondary index.
  - **Legacy keys** `db.autoscaling_enabled`, `db.autoscaling_defaults` and
    `db.autoscaling_indexes` are still accepted and take precedence over the nested
    `db.autoscaling.*` keys.

# How to use this project
usage: |-
  ### Terragrunt scaffolding workflow

  Terragrunt scaffold reads `.boilerplate/boilerplate.yml` and generates `terragrunt.hcl`,
  `inputs.yaml` and `local-tags.json` in the current directory.

  ```sh
  # 1. Create and enter the target deployment directory
  mkdir -p <environment>/<region>/<spoke>/dynamodb-instance
  cd <environment>/<region>/<spoke>/dynamodb-instance

  # 2. Scaffold the module (do NOT use --working-dir)
  terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-dynamodb-instance

  # 3. Edit inputs.yaml with deployment-specific values
  #    (all keys and comments are pre-populated from .boilerplate/inputs.yaml)
  vi inputs.yaml

  # 4. Apply
  terragrunt apply
  ```

  The scaffold asks for these boilerplate variables:

  | Variable | Default | Description |
  |----------|---------|-------------|
  | `is_hub` | `false` | Hub or spoke deployment. |
  | `tags` | `{}` | Tags written to `local-tags.json`. |
  | `kms_enabled` | `false` | Add a `dependency "kms"` block and force encryption with its key. |
  | `kms_path` | `../kms` | Relative path to the KMS deployment, used when `kms_enabled` is `true`. |

  ### Generated `inputs.yaml`

  Only `attributes` and `hash_key` are required. Uncomment the keys you need; keys left
  commented use the module defaults. Uncommenting a configuration line (removing the `# `
  after the indentation) gives valid YAML at the right nesting level.

  ```yaml
  ## DynamoDB Instance module, deployment configuration.
  # Generated by terragrunt scaffold. Fill in the values before running terragrunt apply.
  # The org, spoke_def, is_hub and extra_tags inputs come from the Terragrunt hierarchy.
  #
  ## Table naming. The table name is the explicit name when set, otherwise
  # the name_prefix followed by the organization unit, environment name, environment type,
  # spoke and short region code (for example myapp-devops-prod-production-001-usea1).
  # Hyphens are converted to underscores in both cases (myapp_devops_prod_production_001_usea1).
  # Set at least one of the two keys.
  #
  name_prefix: ""                   # (Optional) Prefix for the generated table name. Ignored when name is set. Default: "".
  name: ""                          # (Optional) Explicit table name, overrides name_prefix. Hyphens become underscores. Default: "".
  ## DynamoDB table configuration. Only attributes and hash_key are required;
  # keys left commented use the module defaults.
  #
  db:                               # (Required) DynamoDB table configuration object. Default: {}.
    #
    ## Attribute definitions. Declare only the attributes used as a table key or as an index key.
    #
    attributes:                     # (Required) List of key attribute definitions.
      - name: "id"                  # (Required) Attribute name.
        type: "S"                   # (Required) Attribute type: S (String) | N (Number) | B (Binary).
    hash_key: "id"                  # (Required) Partition key. Must be declared in attributes.
    # range_key: "sk"               # (Optional) Sort key. Must be declared in attributes. Default: null (no sort key).
    # table_class: "STANDARD"       # (Optional) Storage class: STANDARD | STANDARD_INFREQUENT_ACCESS. Default: null (AWS uses STANDARD).
    # deletion_protection: true     # (Optional) Block table deletion through the API. Default: true.
    #
    ## Billing mode and table capacity. read and write are used only with PROVISIONED billing;
    # with autoscaling enabled they are also the minimum capacity of the table.
    #
    # capacity:                     # (Optional) Capacity settings. Default: on-demand billing.
      # billing_mode: "PAY_PER_REQUEST"  # (Optional) Billing mode: PAY_PER_REQUEST | PROVISIONED. Default: PAY_PER_REQUEST.
      # read: 5                     # (Optional) Read capacity units, at least 1 with PROVISIONED. Default: 0.
      # write: 5                    # (Optional) Write capacity units, at least 1 with PROVISIONED. Default: 0.
    #
    ## Application Auto Scaling for PROVISIONED tables and their GSIs.
    # The defaults map is merged with scale_in_cooldown 0, scale_out_cooldown 0 and target_value 70,
    # so set only the keys you want to change.
    #
    # autoscaling:                  # (Optional) Autoscaling settings. Default: disabled.
      # enabled: false              # (Optional) Enable autoscaling. Requires billing_mode PROVISIONED. Default: false.
      # defaults:                   # (Optional) Default policy values for read, write and indexes. Default: {}.
        # scale_in_cooldown: 0      # (Optional) Seconds between scale-in activities. Default: 0.
        # scale_out_cooldown: 0     # (Optional) Seconds between scale-out activities. Default: 0.
        # target_value: 70          # (Optional) Target utilization percentage. Default: 70.
      # read:                       # (Optional) Table read scaling. Omit to skip read scaling. Default: {}.
        # max_capacity: 100         # (Required) Maximum read capacity. The minimum is capacity.read.
        # target_value: 70          # (Optional) Overrides defaults.target_value.
      # write:                      # (Optional) Table write scaling. Omit to skip write scaling. Default: {}.
        # max_capacity: 100         # (Required) Maximum write capacity. The minimum is capacity.write.
        # target_value: 70          # (Optional) Overrides defaults.target_value.
      #
      ## Per-index scaling, keyed by GSI name. Each entry also accepts
      # scale_in_cooldown, scale_out_cooldown and target_value.
      #
      # indexes:                    # (Optional) Map of GSI name to scaling limits. Default: {}.
        # email-index:              # (Optional) GSI name, as declared in global_secondary_indexes.
          # read_min_capacity: 5    # (Required) Minimum read capacity of the index.
          # read_max_capacity: 50   # (Required) Maximum read capacity of the index.
          # write_min_capacity: 5   # (Required) Minimum write capacity of the index.
          # write_max_capacity: 50  # (Required) Maximum write capacity of the index.
    # encryption:                   # (Optional) Server-side encryption settings. Default: AWS owned key.
      # enabled: true               # (Optional) Use a KMS key (AWS managed or customer managed). Default: false.
      # kms_key_arn: "arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab"  # (Optional) Customer managed key ARN. Default: null (alias/aws/dynamodb).
    # recovery:                     # (Optional) Point-in-time recovery settings. Default: disabled.
      # enabled: true               # (Optional) Enable point-in-time recovery. Default: false.
      # period_in_days: 35          # (Optional) Recovery window, 1 to 35 days. Default: null (AWS uses 35).
    # stream:                       # (Optional) DynamoDB Streams settings. Default: disabled.
      # enabled: true               # (Optional) Enable the stream. Required for replicas. Default: false.
      # view_type: "NEW_AND_OLD_IMAGES"  # (Optional) KEYS_ONLY | NEW_IMAGE | OLD_IMAGE | NEW_AND_OLD_IMAGES. Default: null.
    # ttl:                          # (Optional) Time to live settings. Default: disabled.
      # enabled: true               # (Optional) Enable TTL. Default: false.
      # attribute_name: "expires_at"  # (Optional) Attribute holding the expiry time in epoch seconds. Default: null.
    #
    ## Global table replicas (version 2019.11.21). Put the list under the regions key,
    # or directly under replicas as a plain list (both forms are equivalent).
    # The stream must be enabled with view_type NEW_AND_OLD_IMAGES.
    #
    # replicas:                     # (Optional) Replica settings. Default: no replicas.
      # regions:                    # (Optional) List of replica regions. Default: [].
        # - region_name: "us-west-2"  # (Required) AWS region of the replica.
          # propagate_tags: true    # (Optional) Copy the table tags to the replica. Default: null (false).
          # point_in_time_recovery: true  # (Optional) Enable PITR on the replica. Default: null (false).
          # deletion_protection_enabled: true  # (Optional) Deletion protection on the replica. Default: null (false).
          # kms_key_arn: "arn:aws:kms:us-west-2:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab"  # (Optional) KMS key in the replica region. Default: null.
          # consistency_mode: "EVENTUAL"  # (Optional) EVENTUAL | STRONG (multi-Region strong consistency). Default: null (EVENTUAL).
    #
    ## Global secondary indexes. Every key used by an index must be declared in attributes.
    #
    # global_secondary_indexes:     # (Optional) List of GSI definitions. Default: [].
      # - name: "email-index"       # (Required) Index name.
        # hash_key: "email"         # (Required) Partition key of the index.
        # range_key: "created_at"   # (Optional) Sort key of the index. Default: null.
        # projection_type: "INCLUDE"  # (Required) ALL | KEYS_ONLY | INCLUDE.
        # non_key_attributes:       # (Optional) Projected attributes, only with INCLUDE. Default: null.
          # - "status"
        # read_capacity: 5          # (Optional) Read capacity, PROVISIONED billing only. Default: null.
        # write_capacity: 5         # (Optional) Write capacity, PROVISIONED billing only. Default: null.
        # on_demand_throughput:     # (Optional) Request unit caps, PAY_PER_REQUEST billing only. Default: none.
          # max_read_request_units: 100   # (Optional) Maximum read request units. Default: null.
          # max_write_request_units: 100  # (Optional) Maximum write request units. Default: null.
        # warm_throughput:          # (Optional) Pre-warmed throughput of the index. Default: none.
          # read_units_per_second: 12000  # (Optional) Warm read units per second. Default: null.
          # write_units_per_second: 4000  # (Optional) Warm write units per second. Default: null.
    # ignore_changes_global_secondary_index: false  # (Optional) Ignore GSI drift, useful with autoscaled GSIs. Default: false.
    #
    ## Local secondary indexes. They can only be created with the table and share its hash key.
    #
    # local_secondary_indexes:      # (Optional) List of LSI definitions. Default: [].
      # - name: "created-at-index"  # (Required) Index name.
        # range_key: "created_at"   # (Required) Sort key of the index.
        # projection_type: "KEYS_ONLY"  # (Required) ALL | KEYS_ONLY | INCLUDE.
        # non_key_attributes: []    # (Optional) Projected attributes, only with INCLUDE. Default: null.
    #
    ## Create the table from an S3 import. Applies only when the table is created;
    # later changes to this block replace the table.
    #
    # import_table:                 # (Optional) S3 import settings. Default: {} (no import).
      # input_format: "CSV"         # (Required) CSV | DYNAMODB_JSON | ION.
      # input_compression_type: "NONE"  # (Optional) GZIP | ZSTD | NONE. Default: null (NONE).
      # bucket: "my-import-bucket"  # (Required) S3 bucket holding the source data.
      # bucket_owner: "123456789012"  # (Optional) Account ID of the bucket owner. Default: null.
      # key_prefix: "exports/orders/"  # (Optional) Key prefix of the source objects. Default: null.
      # input_format_options:       # (Optional) Format options, CSV only. Default: none.
        # csv:                      # (Optional) CSV options.
          # delimiter: ","          # (Optional) Field delimiter. Default: null (comma).
          # header_list:            # (Optional) Column names when the files have no header row. Default: null.
            # - "id"
            # - "status"
  ```

  ### Generated `terragrunt.hcl`

  Rendered for `kms_enabled: false` and `is_hub: false`:

  ```hcl
  locals {
    local_vars  = yamldecode(file("./inputs.yaml"))
    spoke_vars  = yamldecode(file(find_in_parent_folders("spoke-inputs.yaml")))
    region_vars = yamldecode(file(find_in_parent_folders("region-inputs.yaml")))
    env_vars    = yamldecode(file(find_in_parent_folders("env-inputs.yaml")))
    global_vars = yamldecode(file(find_in_parent_folders("global-inputs.yaml")))

    local_tags  = jsondecode(file("./local-tags.json"))
    spoke_tags  = jsondecode(file(find_in_parent_folders("spoke-tags.json")))
    region_tags = jsondecode(file(find_in_parent_folders("region-tags.json")))
    env_tags    = jsondecode(file(find_in_parent_folders("env-tags.json")))
    global_tags = jsondecode(file(find_in_parent_folders("global-tags.json")))

    tags = merge(
      local.global_tags,
      local.env_tags,
      local.region_tags,
      local.spoke_tags,
      local.local_tags
    )
  }

  include "root" {
    path = find_in_parent_folders("root.hcl")
  }

  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-aws-dynamodb-instance.git//?ref=v2.0.3"
  }

  inputs = {
    is_hub      = false
    org         = local.env_vars.org
    spoke_def   = local.spoke_vars.spoke
    db          = try(local.local_vars.db, {})
    name        = try(local.local_vars.name, "")
    name_prefix = try(local.local_vars.name_prefix, "")
    extra_tags  = local.tags
  }
  ```

  With `kms_enabled: true` the scaffold adds a `dependency "kms"` block (path `kms_path`) and
  replaces the `db` input so encryption always uses that key:

  ```hcl
  dependency "kms" {
    config_path = "../kms"
    mock_outputs_allowed_terraform_commands = ["validate", "destroy"]
    mock_outputs = {
      key_id  = "1234abcd-12ab-34cd-56ef-1234567890ab"
      key_arn = "arn:aws:kms:us-east-1:123456789012:key/1234abcd-12ab-34cd-56ef-1234567890ab"
    }
  }

  inputs = {
    # ...
    db = merge(local.local_vars.db, {
      encryption = {
        enabled     = true
        kms_key_arn = dependency.kms.outputs.key_arn
      }
    })
    # ...
  }
  ```

  ### Inputs

  `org`, `spoke_def`, `is_hub` and `extra_tags` are supplied by the Terragrunt hierarchy.

  | Variable | Type | Required | Default | Description |
  |----------|------|:--------:|---------|-------------|
  | `name_prefix` | `string` | no | `""` | Prefix for the generated table name. |
  | `name` | `string` | no | `""` | Explicit table name, overrides `name_prefix`. |
  | `db` | `any` | yes | `{}` | Table configuration object (keys below). |

  | `db` key | Type | Required | Default | Description |
  |----------|------|:--------:|---------|-------------|
  | `attributes` | `list(object)` | yes | `[]` | Key attributes: `name` and `type` (`S`, `N`, `B`). |
  | `hash_key` | `string` | yes | `null` | Partition key, declared in `attributes`. |
  | `range_key` | `string` | no | `null` | Sort key, declared in `attributes`. |
  | `table_class` | `string` | no | `null` (`STANDARD`) | `STANDARD` or `STANDARD_INFREQUENT_ACCESS`. |
  | `deletion_protection` | `bool` | no | `true` | Deletion protection. |
  | `capacity.billing_mode` | `string` | no | `PAY_PER_REQUEST` | `PAY_PER_REQUEST` or `PROVISIONED`. |
  | `capacity.read` / `capacity.write` | `number` | no | `0` | Provisioned capacity, at least 1 each with `PROVISIONED`; also the autoscaling minimum. |
  | `autoscaling.enabled` | `bool` | no | `false` | Enable Application Auto Scaling (provisioned tables). |
  | `autoscaling.defaults` | `map` | no | `{}` | `scale_in_cooldown`, `scale_out_cooldown`, `target_value`, merged with `0` / `0` / `70`. |
  | `autoscaling.read` / `autoscaling.write` | `map` | no | `{}` | `max_capacity` (required) plus optional policy overrides. |
  | `autoscaling.indexes` | `map(map)` | no | `{}` | Per-GSI `read_min_capacity`, `read_max_capacity`, `write_min_capacity`, `write_max_capacity`. |
  | `encryption.enabled` | `bool` | no | `false` | Use a KMS key for encryption at rest. |
  | `encryption.kms_key_arn` | `string` | no | `null` | Customer managed key ARN (`alias/aws/dynamodb` when unset). |
  | `recovery.enabled` | `bool` | no | `false` | Point-in-time recovery. |
  | `recovery.period_in_days` | `number` | no | `null` (`35`) | Recovery window, 1 to 35 days. |
  | `stream.enabled` | `bool` | no | `false` | DynamoDB Streams. |
  | `stream.view_type` | `string` | no | `null` | `KEYS_ONLY`, `NEW_IMAGE`, `OLD_IMAGE`, `NEW_AND_OLD_IMAGES`. |
  | `ttl.enabled` | `bool` | no | `false` | Time to live. |
  | `ttl.attribute_name` | `string` | no | `null` | Attribute holding the expiry epoch. |
  | `replicas.regions` (or `replicas` as a list) | `list(object)` | no | `[]` | Replicas: `region_name`, `propagate_tags`, `point_in_time_recovery`, `deletion_protection_enabled`, `kms_key_arn`, `consistency_mode`. |
  | `global_secondary_indexes` | `list(object)` | no | `[]` | GSIs: `name`, `hash_key`, `range_key`, `projection_type`, `non_key_attributes`, `read_capacity`, `write_capacity`, `on_demand_throughput`, `warm_throughput`. |
  | `ignore_changes_global_secondary_index` | `bool` | no | `false` | Ignore GSI drift (autoscaled GSIs). |
  | `local_secondary_indexes` | `list(object)` | no | `[]` | LSIs: `name`, `range_key`, `projection_type`, `non_key_attributes`. |
  | `import_table` | `object` | no | `{}` | S3 import: `input_format`, `input_compression_type`, `bucket`, `bucket_owner`, `key_prefix`, `input_format_options.csv`. |

  ### Outputs

  | Output | Description |
  |--------|-------------|
  | `dynamodb_table_id` | Name/ID of the DynamoDB table. |
  | `dynamodb_table_arn` | ARN of the DynamoDB table. |

  ### Module tests

  Native tests live in `tests/` and run on every pull request through
  `.github/workflows/module-tests.yml`. They use `command = plan` with a mocked AWS provider,
  so no credentials are needed.

  42 cases in 5 suites:

  | Suite | Cases |
  |-------|-------|
  | `tests/naming.tftest.hcl` | Prefix-based name, explicit name (case kept), region/spoke naming, hyphenated environment type, `ap-southeast-2` region code, empty name and prefix, tag merge and override, output wiring, scaffolded `inputs.yaml` |
  | `tests/capacity.tftest.hcl` | Defaults, deletion protection off, provisioned composite key, on-demand without capacity values, partial, missing and full autoscaling defaults, GSI autoscaling, legacy autoscaling keys and their precedence |
  | `tests/features.tftest.hcl` | Customer and AWS managed KMS keys, PITR with and without a window, streams (incl. `KEYS_ONLY`)/TTL/table class, replicas (`regions` form, plain list, empty list, empty object, attributes reaching the table), GSI/LSI, GSI throughput settings, CSV and minimal DynamoDB JSON S3 imports |
  | `tests/validation.tftest.hcl` | `spoke_def` length validation |
  | `tests/variants.tftest.hcl` | Which upstream table resource is planned: standard, autoscaled, autoscaled with GSI drift ignored, GSI drift ignored without autoscaling |

  ```sh
  tofu init -backend=false -test-directory=tests
  tofu test -test-directory=tests
  ```

# Example usage
examples: |-
  Each example is the `inputs.yaml` of one deployment directory.

  ### On-demand table with a single partition key

  ```yaml
  name_prefix: "myapp"
  db:
    attributes:
      - name: "user_id"
        type: "S"
    hash_key: "user_id"
  ```

  ### Provisioned table with an autoscaled GSI

  ```yaml
  name_prefix: "myapp"
  db:
    attributes:
      - name: "user_id"
        type: "S"
      - name: "email"
        type: "S"
    hash_key: "user_id"
    capacity:
      billing_mode: "PROVISIONED"
      read: 5
      write: 5
    global_secondary_indexes:
      - name: "email-index"
        hash_key: "email"
        projection_type: "ALL"
        read_capacity: 5
        write_capacity: 5
    ignore_changes_global_secondary_index: true
    autoscaling:
      enabled: true
      defaults:
        target_value: 60
      read:
        max_capacity: 100
      write:
        max_capacity: 50
      indexes:
        email-index:
          read_min_capacity: 5
          read_max_capacity: 50
          write_min_capacity: 5
          write_max_capacity: 50
  ```

  ### Encrypted global table with streams, PITR and TTL

  ```yaml
  name: "orders"
  db:
    attributes:
      - name: "pk"
        type: "S"
      - name: "sk"
        type: "S"
    hash_key: "pk"
    range_key: "sk"
    encryption:
      enabled: true
      kms_key_arn: "arn:aws:kms:us-east-1:123456789012:key/mrk-1234abcd12ab34cd56ef1234567890ab"
    recovery:
      enabled: true
      period_in_days: 35
    stream:
      enabled: true
      view_type: "NEW_AND_OLD_IMAGES"
    ttl:
      enabled: true
      attribute_name: "expires_at"
    replicas:
      regions:
        - region_name: "us-west-2"
          propagate_tags: true
          point_in_time_recovery: true
          kms_key_arn: "arn:aws:kms:us-west-2:123456789012:key/mrk-1234abcd12ab34cd56ef1234567890ab"
  ```

  ### Composite key with GSI and LSI

  ```yaml
  name_prefix: "events"
  db:
    attributes:
      - name: "tenant_id"
        type: "S"
      - name: "event_id"
        type: "S"
      - name: "created_at"
        type: "N"
      - name: "event_type"
        type: "S"
    hash_key: "tenant_id"
    range_key: "event_id"
    table_class: "STANDARD_INFREQUENT_ACCESS"
    global_secondary_indexes:
      - name: "by-type"
        hash_key: "event_type"
        range_key: "created_at"
        projection_type: "INCLUDE"
        non_key_attributes:
          - "status"
    local_secondary_indexes:
      - name: "by-created-at"
        range_key: "created_at"
        projection_type: "KEYS_ONLY"
  ```

  ### Table created from an S3 CSV export

  ```yaml
  name: "customers-import"
  db:
    attributes:
      - name: "customer_id"
        type: "S"
    hash_key: "customer_id"
    deletion_protection: false
    import_table:
      input_format: "CSV"
      input_compression_type: "GZIP"
      bucket: "my-import-bucket"
      key_prefix: "exports/customers/"
      input_format_options:
        csv:
          delimiter: ","
          header_list:
            - "customer_id"
            - "name"
  ```

# How to get started quickly
quickstart: |-
  1. Create and enter the target deployment directory:
     ```sh
     mkdir -p production/us-east-1/001/dynamodb-instance
     cd production/us-east-1/001/dynamodb-instance
     ```

  2. Scaffold the module:
     ```sh
     terragrunt scaffold github.com/cloudopsworks/terraform-module-aws-dynamodb-instance
     ```

  3. Edit `inputs.yaml`: set `name_prefix` or `name`, declare the key `attributes` and the
     `hash_key`, and uncomment any optional settings:
     ```sh
     vi inputs.yaml
     ```

  4. Review and apply:
     ```sh
     terragrunt plan
     terragrunt apply
     ```

